<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weather</title>
<style>
/* Platinum values match the exe desktop (macthemes.garden pixel bevels) */
:root {
  --black: #262626;
  --g200: #eee; --g300: #ddd; --g400: #ccc; --g500: #bbb; --g600: #999;
  --hl: #333399; --red: #cc3333;
  --font: "Charcoal", "Chicago", "Geneva", "Lucida Grande", "Lucida Sans", Geneva, Verdana, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 12px/1.45 var(--font); color: var(--black); background: var(--g200);
  user-select: none; cursor: default; overflow: hidden; display: flex; flex-direction: column; }

#bar { display: flex; gap: 8px; padding: 10px 10px 8px; align-items: center; }
input[type=text] { background: #fff; color: var(--black);
  border: 1px solid var(--black); border-radius: 0; padding: 2px 5px; font: inherit; font-size: 12px;
  height: 20px; line-height: 14px;
  box-shadow: -1px -1px 0 var(--g600), -1px 0 0 var(--g600), 0 -1px 0 var(--g600),
    1px 1px 0 #fff, 1px 0 0 #fff, 0 1px 0 #fff; }
input[type=text]:focus { outline: 2px solid #9999fe; outline-offset: 0; }

button { font: inherit; cursor: default; }
button.ghost { background: var(--g300); color: var(--black);
  border: 1px solid var(--black); border-radius: 3px;
  padding: 2px 13px; font-size: 12px; line-height: 14px; font-weight: bold; height: 20px;
  box-shadow: inset 1px 1px 0 var(--g300), inset -1px -1px 0 #777,
    inset 2px 2px 0 #fff, inset -2px -2px 0 #aaa; }
button.ghost:active { background: #666; color: #fff;
  box-shadow: inset 1px 1px 0 #444, inset -1px -1px 0 #888,
    inset 2px 2px 0 #555, inset -2px -2px 0 #777; }
button.ghost.danger { color: #7a1010; }
button.ghost.armed { background: var(--red); color: #fff;
  box-shadow: inset 1px 1px 0 #e88, inset -1px -1px 0 #911; }
button.ghost.sm { padding: 1px 8px; font-size: 10px; border-radius: 3px; height: auto; }

#q-wrap { position: relative; flex: 1; min-width: 0; }
#q { width: 100%; }
#drop { position: absolute; left: 0; right: 0; top: 21px; z-index: 5;
  background: #fff; border: 1px solid var(--black); box-shadow: 2px 2px 0 rgba(0,0,0,.35);
  max-height: 208px; overflow-y: auto; overflow-x: hidden; }
#drop .opt { display: flex; gap: 6px; padding: 3px 6px; white-space: nowrap; overflow: hidden; }
#drop .opt b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: normal; }
#drop .opt .id { flex: none; color: #777; font-size: 10px; }
#drop .opt.have b { color: #777; }
#drop .opt.hot, #drop .opt:hover { background: var(--hl); color: #fff; }
#drop .opt.hot b, #drop .opt:hover b, #drop .opt.hot .id, #drop .opt:hover .id { color: #ccf; }
#drop .opt.hot b, #drop .opt:hover b { color: #fff; }
#drop .note { padding: 4px 6px; color: #555; font-size: 11px; }

/* Pop-up menu button (Blue Pencil's block, from HIG fig. 2-7): a 19px
   rounded black outline, white top and left, #aaa bottom, a 21px arrow
   well on the right with its own bevel, a transparent native select
   inside. Every 1px line is a border on a box of its own. */
.popup { position: relative; display: block; height: 19px; overflow: hidden;
  border: 1px solid #000; border-radius: 3px; background: var(--g300); }
.popup::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(100% - 21px);
  box-sizing: border-box; border-top: 1px solid #fff; border-left: 1px solid #fff; border-bottom: 1px solid #aaa; }
.popup .well { position: absolute; right: 0; top: 1px; bottom: 0; width: 21px;
  border-left: 1px solid #aaa; pointer-events: none; }
.popup .well i { position: absolute; left: 1px; top: 0; right: 0; bottom: 0;
  border-right: 1px solid #777; border-bottom: 1px solid #777; }
.popup .well b { position: absolute; inset: 0;
  border-top: 1px solid #fff; border-left: 1px solid #fff;
  border-right: 1px solid #aaa; border-bottom: 1px solid #aaa;
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="7" height="10" shape-rendering="crispEdges"><path fill="black" d="M3 0h1v1H3zM2 1h3v1H2zM1 2h5v1H1zM0 3h7v1H0zM0 6h7v1H0zM1 7h5v1H1zM2 8h3v1H2zM3 9h1v1H3z"/></svg>') 4px 1px no-repeat; }
@media (min-resolution: 1.01dppx) and (max-resolution: 1.99dppx) {
  .popup .well b { background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="7" height="10" shape-rendering="geometricPrecision"><path fill="black" d="M3.5 0L7 4H0zM0 6h7l-3.5 4z"/></svg>'); }
}
.popup select { position: absolute; inset: 0; width: 100%; height: 100%; appearance: none;
  background: transparent; border: 0; border-radius: 0; padding: 0 27px 0 6px; margin: 0;
  color: #000; font: 12px/17px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.popup select:focus { outline: none; }
#units-wrap { flex: none; width: 124px; }

/* the cities are a document area: flush left/right/bottom, separator on
   top, an always-on OS 9 scrollbar like a Finder list */
#list { flex: 1; min-height: 0; background: #fff; border-top: 1px solid var(--black);
  overflow-y: scroll; overflow-x: hidden; }
.row { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 8px; border-bottom: 1px solid #efefef; }
.row.flash { background: #e6e6ff; }
/* the Finder list view's disclosure triangle, sampled from Mac OS 9:
   lavender face, black outline, a one-pixel gray shadow to the lower right */
.tri { flex: none; width: 12px; height: 12px; background: no-repeat center;
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="9" height="12" shape-rendering="crispEdges"><path fill="%23000000" d="M0 0h1v1H0zM0 1h1v1H0zM1 1h1v1H1zM0 2h1v1H0zM2 2h1v1H2zM0 3h1v1H0zM3 3h1v1H3zM0 4h1v1H0zM4 4h1v1H4zM0 5h1v1H0zM5 5h1v1H5zM0 6h1v1H0zM4 6h1v1H4zM0 7h1v1H0zM3 7h1v1H3zM0 8h1v1H0zM2 8h1v1H2zM0 9h1v1H0zM1 9h1v1H1zM0 10h1v1H0z"/><path fill="%23ccccff" d="M1 2h1v1H1zM1 3h1v1H1zM1 4h1v1H1zM1 5h1v1H1zM1 6h1v1H1zM1 7h1v1H1z"/><path fill="%239999ff" d="M2 3h1v1H2zM2 4h1v1H2zM3 4h1v1H3zM2 5h1v1H2zM3 5h1v1H3zM2 6h1v1H2zM1 8h1v1H1z"/><path fill="%236666cc" d="M4 5h1v1H4zM3 6h1v1H3zM2 7h1v1H2z"/><path fill="%23888888" d="M5 6h1v1H5zM4 7h1v1H4zM3 8h1v1H3zM2 9h1v1H2zM1 10h1v1H1z"/><path fill="%23bbbbbb" d="M6 6h1v1H6zM5 7h1v1H5zM4 8h1v1H4zM3 9h1v1H3zM2 10h1v1H2zM1 11h1v1H1z"/></svg>'); }
.open > .row .tri, .sec.open .tri { background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="9" shape-rendering="crispEdges"><path fill="%23000000" d="M0 0h1v1H0zM1 0h1v1H1zM2 0h1v1H2zM3 0h1v1H3zM4 0h1v1H4zM5 0h1v1H5zM6 0h1v1H6zM7 0h1v1H7zM8 0h1v1H8zM9 0h1v1H9zM10 0h1v1H10zM1 1h1v1H1zM9 1h1v1H9zM2 2h1v1H2zM8 2h1v1H8zM3 3h1v1H3zM7 3h1v1H7zM4 4h1v1H4zM6 4h1v1H6zM5 5h1v1H5z"/><path fill="%23ccccff" d="M2 1h1v1H2zM3 1h1v1H3zM4 1h1v1H4zM5 1h1v1H5zM6 1h1v1H6zM7 1h1v1H7z"/><path fill="%239999ff" d="M8 1h1v1H8zM3 2h1v1H3zM4 2h1v1H4zM5 2h1v1H5zM6 2h1v1H6zM4 3h1v1H4zM5 3h1v1H5z"/><path fill="%23888888" d="M10 1h1v1H10zM9 2h1v1H9zM8 3h1v1H8zM7 4h1v1H7zM6 5h1v1H6z"/><path fill="%23bbbbbb" d="M11 1h1v1H11zM10 2h1v1H10zM9 3h1v1H9zM8 4h1v1H8zM7 5h1v1H7zM6 6h1v1H6z"/><path fill="%236666cc" d="M7 2h1v1H7zM6 3h1v1H6zM5 4h1v1H5z"/></svg>'); }
.icon { flex: none; width: 32px; height: 32px; }
.icon svg { display: block; width: 32px; height: 32px; }
.who { flex: 1; min-width: 0; }
.city { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { font-size: 11px; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.when { flex: none; text-align: right; }
.temp { font-size: 18px; font-weight: bold; line-height: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hilo { font-size: 11px; color: #777; line-height: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; min-height: 14px; }
.row .x { flex: none; }
#empty { padding: 14px 10px; color: #777; }

/* an opened city: its sections indented under the row, each with its own
   triangle; label/value pairs for Now and Place, day and hour tables for
   the forecast, in bordered boxes that scroll sideways */
.detail { display: none; padding: 2px 10px 6px 24px; border-bottom: 1px solid #efefef; }
.open > .detail { display: block; }
.sec { display: flex; align-items: center; gap: 6px; height: 20px; font-size: 11px; font-weight: bold; }
.sec .tri { width: 12px; height: 12px; }
.sec .n { font-weight: normal; color: #777; }
.body { display: none; padding: 0 0 6px 18px; }
.sec.open + .body { display: block; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 14px;
  font-size: 11px; line-height: 16px; }
.kv .k { color: #555; white-space: nowrap; }
.kv .v { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.tbox { border: 1px solid var(--black); background: #fff; overflow-x: scroll; overflow-y: hidden; margin: 2px 0 2px; }
.tbox table { border-collapse: separate; border-spacing: 0; font-size: 11px; line-height: 15px;
  font-variant-numeric: tabular-nums; }
.tbox th, .tbox td { padding: 0 6px; white-space: nowrap; border-bottom: 1px solid #efefef; text-align: right; font-weight: normal; }
.tbox th.lab { position: sticky; left: 0; background: #fff; text-align: left; color: #555; border-right: 1px solid var(--black); z-index: 1; }
.tbox thead th { background: var(--g200); text-align: center; border-bottom: 1px solid var(--black); font-weight: bold; }
.tbox thead th.lab { background: var(--g200); }
.tbox thead tr.days th { border-bottom: 1px solid #ccc; font-weight: normal; color: #555; }
.tbox thead tr.days th.lab { border-bottom: 1px solid #ccc; }
.tbox td.day0 { border-left: 1px solid #ccc; }
.tbox td.now { background: #e6e6ff; }
.tbox tbody tr:last-child td, .tbox tbody tr:last-child th { border-bottom: 0; }
.wait { font-size: 11px; color: #777; line-height: 16px; }

/* 15px total (1px border + 14px face), same as the desktop's statusbars;
   the grow tile's black top row lands on this border-top line */
#status { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--black);
  background: var(--g300); font-size: 11px; color: #333; padding: 0 20px 0 8px; height: 15px;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,.6), inset -1px -1px 0 #aaa; }
#st-left { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#st-right { flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#grow { position: fixed; right: 0; bottom: 0; width: 15px; height: 15px;
  touch-action: none; z-index: 6; }

/* Mac OS 9 scrollbars — the desktop's pixel-sampled spec, adapted for a
   document window: the host frame (or a bordered box) draws the outer black
   line, so bars are 15px (1px leading separator + the sampled 14px face)
   with no trailing border of their own — otherwise the edge doubles to 2px.
   Vertical is the city list against the window frame; horizontal is the
   forecast tables inside their own boxes. */
::-webkit-scrollbar { width: 15px; height: 15px; }
::-webkit-scrollbar-track:vertical { border-left: 1px solid var(--black);
  background: linear-gradient(to right, #777 0, #777 1px, #888 1px, #888 2px, #aaa 2px, #aaa 12px, #bbb 12px, #bbb 13px, #ccc 13px, #ccc 14px); }
::-webkit-scrollbar-track:horizontal { border-top: 1px solid var(--black);
  background: linear-gradient(to bottom, #777 0, #777 1px, #888 1px, #888 2px, #aaa 2px, #aaa 12px, #bbb 12px, #bbb 13px, #ccc 13px, #ccc 14px); }
::-webkit-scrollbar-thumb:vertical { border: 1px solid var(--black); border-right: 0;
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="8" shape-rendering="crispEdges"><rect x="3" y="0" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="0" width="6" height="1" fill="%23ccccff"/><rect x="4" y="1" width="7" height="1" fill="%23333399"/><rect x="3" y="2" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="2" width="6" height="1" fill="%23ccccff"/><rect x="4" y="3" width="7" height="1" fill="%23333399"/><rect x="3" y="4" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="4" width="6" height="1" fill="%23ccccff"/><rect x="4" y="5" width="7" height="1" fill="%23333399"/><rect x="3" y="6" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="6" width="6" height="1" fill="%23ccccff"/><rect x="4" y="7" width="7" height="1" fill="%23333399"/></svg>') center no-repeat,
    linear-gradient(to right, #ccccff 0 1px, #9999ff 1px 13px, #6666cc 13px 14px);
  box-shadow: inset 0 1px 0 #ccccff, inset 0 -1px 0 #6666cc; }
::-webkit-scrollbar-thumb:horizontal { border: 1px solid var(--black); border-bottom: 0;
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="14" shape-rendering="crispEdges"><rect x="0" y="3" width="1" height="1" fill="%23eeeeee"/><rect x="0" y="4" width="1" height="6" fill="%23ccccff"/><rect x="1" y="4" width="1" height="7" fill="%23333399"/><rect x="2" y="3" width="1" height="1" fill="%23eeeeee"/><rect x="2" y="4" width="1" height="6" fill="%23ccccff"/><rect x="3" y="4" width="1" height="7" fill="%23333399"/><rect x="4" y="3" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="4" width="1" height="6" fill="%23ccccff"/><rect x="5" y="4" width="1" height="7" fill="%23333399"/><rect x="6" y="3" width="1" height="1" fill="%23eeeeee"/><rect x="6" y="4" width="1" height="6" fill="%23ccccff"/><rect x="7" y="4" width="1" height="7" fill="%23333399"/></svg>') center no-repeat,
    linear-gradient(to bottom, #ccccff 0 1px, #9999ff 1px 13px, #6666cc 13px 14px);
  box-shadow: inset 1px 0 0 #ccccff, inset -1px 0 0 #6666cc; }
::-webkit-scrollbar-thumb:vertical:active {
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="8" shape-rendering="crispEdges"><rect x="3" y="0" width="1" height="1" fill="%23ccccff"/><rect x="4" y="0" width="6" height="1" fill="%239999ff"/><rect x="4" y="1" width="7" height="1" fill="%23000066"/><rect x="3" y="2" width="1" height="1" fill="%23ccccff"/><rect x="4" y="2" width="6" height="1" fill="%239999ff"/><rect x="4" y="3" width="7" height="1" fill="%23000066"/><rect x="3" y="4" width="1" height="1" fill="%23ccccff"/><rect x="4" y="4" width="6" height="1" fill="%239999ff"/><rect x="4" y="5" width="7" height="1" fill="%23000066"/><rect x="3" y="6" width="1" height="1" fill="%23ccccff"/><rect x="4" y="6" width="6" height="1" fill="%239999ff"/><rect x="4" y="7" width="7" height="1" fill="%23000066"/></svg>') center no-repeat,
    linear-gradient(to right, #9999ff 0 1px, #6666cc 1px 13px, #333399 13px 14px);
  box-shadow: inset 0 1px 0 #9999ff, inset 0 -1px 0 #333399; }
::-webkit-scrollbar-thumb:horizontal:active {
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="14" shape-rendering="crispEdges"><rect x="0" y="3" width="1" height="1" fill="%23ccccff"/><rect x="0" y="4" width="1" height="6" fill="%239999ff"/><rect x="1" y="4" width="1" height="7" fill="%23000066"/><rect x="2" y="3" width="1" height="1" fill="%23ccccff"/><rect x="2" y="4" width="1" height="6" fill="%239999ff"/><rect x="3" y="4" width="1" height="7" fill="%23000066"/><rect x="4" y="3" width="1" height="1" fill="%23ccccff"/><rect x="4" y="4" width="1" height="6" fill="%239999ff"/><rect x="5" y="4" width="1" height="7" fill="%23000066"/><rect x="6" y="3" width="1" height="1" fill="%23ccccff"/><rect x="6" y="4" width="1" height="6" fill="%239999ff"/><rect x="7" y="4" width="1" height="7" fill="%23000066"/></svg>') center no-repeat,
    linear-gradient(to bottom, #9999ff 0 1px, #6666cc 1px 13px, #333399 13px 14px);
  box-shadow: inset 1px 0 0 #9999ff, inset -1px 0 0 #333399; }
:not(.scrolled-y)::-webkit-scrollbar-thumb:vertical {
  border-top-color: #ccccff; box-shadow: inset 0 -1px 0 #6666cc; }
:not(.scrolled-y)::-webkit-scrollbar-thumb:vertical:active {
  border-top-color: #9999ff; box-shadow: inset 0 -1px 0 #333399; }
.at-y-end::-webkit-scrollbar-thumb:vertical {
  border-bottom-color: #6666cc; box-shadow: inset 0 1px 0 #ccccff; }
.at-y-end::-webkit-scrollbar-thumb:vertical:active {
  border-bottom-color: #333399; box-shadow: inset 0 1px 0 #9999ff; }
:not(.scrolled-x)::-webkit-scrollbar-thumb:horizontal {
  border-left-color: #ccccff; box-shadow: inset -1px 0 0 #6666cc; }
:not(.scrolled-x)::-webkit-scrollbar-thumb:horizontal:active {
  border-left-color: #9999ff; box-shadow: inset -1px 0 0 #333399; }
.at-x-end::-webkit-scrollbar-thumb:horizontal {
  border-right-color: #6666cc; box-shadow: inset 1px 0 0 #ccccff; }
.at-x-end::-webkit-scrollbar-thumb:horizontal:active {
  border-right-color: #333399; box-shadow: inset 1px 0 0 #9999ff; }
::-webkit-scrollbar-button { display: block; width: 16px; height: 16px;
  background: #ddd; border: 1px solid var(--black);
  box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #bbb;
  background-position: center; background-repeat: no-repeat; }
::-webkit-scrollbar-button:vertical { border-right: 0; }
::-webkit-scrollbar-button:vertical:end:increment:enabled { height: 14px; border-top: 0; border-bottom: 0; }
::-webkit-scrollbar-button:horizontal { border-bottom: 0; }
::-webkit-scrollbar-button:horizontal:end:increment:enabled { width: 14px; border-left: 0; border-right: 0; }
::-webkit-scrollbar-button:vertical:decrement {
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="4" shape-rendering="crispEdges"><path fill="black" d="M3 0h2v1h-2z M2 1h4v1h-4z M1 2h6v1h-6z M0 3h8v1h-8z"/></svg>'); }
::-webkit-scrollbar-button:vertical:increment {
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="4" shape-rendering="crispEdges"><path fill="black" d="M0 0h8v1h-8z M1 1h6v1h-6z M2 2h4v1h-4z M3 3h2v1h-2z"/></svg>'); }
::-webkit-scrollbar-button:horizontal:decrement {
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="8" shape-rendering="crispEdges"><path fill="black" d="M0 3h1v2h-1z M1 2h1v4h-1z M2 1h1v6h-1z M3 0h1v8h-1z"/></svg>'); }
::-webkit-scrollbar-button:horizontal:increment {
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="4" height="8" shape-rendering="crispEdges"><path fill="black" d="M0 0h1v8h-1z M1 1h1v6h-1z M2 2h1v4h-1z M3 3h1v2h-1z"/></svg>'); }
::-webkit-scrollbar-button:active { background-color: #777;
  box-shadow: inset 1px 1px 0 #555, inset -1px -1px 0 #999; }
::-webkit-scrollbar-button:vertical:start:decrement,
::-webkit-scrollbar-button:vertical:start:increment,
::-webkit-scrollbar-button:horizontal:start:decrement,
::-webkit-scrollbar-button:horizontal:start:increment { display: none; }
/* Disabled (nothing to scroll), sampled from OS 9: the strip goes flat #eee
   between the rails, arrows ghost to #888 with no button face or bevel,
   and a 1px #888 line separates the two arrows. The list sits in this
   state until it holds more cities than the window shows; a forecast
   table narrower than its box too. */
::-webkit-scrollbar-track:disabled { background: #eee; }
::-webkit-scrollbar-button:disabled { background-color: #eee; box-shadow: none; border: 0; }
::-webkit-scrollbar-button:vertical:disabled { border-left: 1px solid var(--black); }
::-webkit-scrollbar-button:horizontal:disabled { border-top: 1px solid var(--black); }
::-webkit-scrollbar-button:vertical:end:increment:disabled { border-top: 1px solid #888; }
::-webkit-scrollbar-button:horizontal:end:increment:disabled { border-left: 1px solid #888; }
/* OS 9 draws a darker #555 line where the disabled arrow pair meets the track */

// Debounced whole-doc PUT, serialized so a slow write is never overtaken;

  clearTimeout(saveT);

}

  const body = JSON.stringify({ version: 1, items }, null, 2);
  // X-Exe-Seq is a content timestamp: the daemon drops a PUT older than one
  // it already stored, so an in-flight save can't land stale over the flush.
  const seq = { "X-Exe-Seq": String(now) };
  if (flush) {
    try { api(DOC_URL, { method: "PUT", keepalive: true, headers: seq, body }); } catch (e) {}
    return;
  }
  if (saving) { again = true; return; }
  saving = true;
  try {
    await api(DOC_URL, { method: "PUT", headers: seq, body });
  } catch (e) { console.error("weather save failed:", e); }
  saving = false;
  if (again) { again = false; saveNow(); }
}

});
addEventListener("pagehide", () => { if (saveT || saving) saveNow(true); });

} catch (e) {}

const dayOf = iso => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(iso || ""); return m ? fmt("d", { weekday: "short", month: "numeric", day: "numeric", timeZone: "UTC" }).format(new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]))) : "—"; };
const weekdayOf = iso => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(iso || ""); return m ? fmt("wd", { weekday: "short", timeZone: "UTC" }).format(new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]))) : ""; };
const COMPASS = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
const compass = deg => COMPASS[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
const hm = s => { const m = Math.round(s / 60); return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m"; };
const num = v => typeof v === "number" ? (Number.isInteger(v) ? String(v) : String(+v.toFixed(2))) : String(v);
// one value, by what the variable is; unit given when it belongs inline
function fmtVal(name, v, unit, inline) {
  if (v === null || v === undefined) return "—";
  if (name === "weather_code") return wmoText(v);
  if (name === "is_day") return v ? "Day" : "Night";
  if (unit === "iso8601") return clockOf(v);
  if (unit === "s") return hm(v);
  if (/^wind_direction/.test(name)) return num(v) + "° " + compass(v);
  if (unit === "%" || unit === "°C" || unit === "°F") return num(v) + unit;
  const u = unitText(unit);
  return inline && u ? num(v) + " " + u : num(v);
}
// a table row's label carries the unit once; a value that spells its own
// (a time, a duration, a compass point, a percentage, a degree sign) needs none
const labelOf = (name, unit) => {
  const u = unitText(unit);
  const own = unit === "iso8601" || unit === "s" || unit === "%" || unit === "°C" || unit === "°F" || /^wind_direction/.test(name);
  return (LABELS[name] || name.replace(/_/g, " ")) + (u && !own ? " (" + u + ")" : "");
};
const deg = v => Math.round(v) + "°";
const coord = v => String(+(+v).toFixed(5)); // the geocoder's five decimals, not num()'s two
const tzLabel = (tz, abbr, off) => {
  const h = Math.trunc(off / 3600), m = Math.abs(off % 3600) / 60;
  return tz + " · " + abbr + " · UTC" + (off < 0 ? "−" : "+") + String(Math.abs(h)).padStart(2, "0") + ":" + String(m).padStart(2, "0");
};

// ---- the list ----
const list = $("#list");
function fillItem(box, it) {
  const row = box.querySelector(".row"), w = wx[it.id], d = w && w.data, c = d && d.current;
  const sub = row.querySelector(".sub"), temp = row.querySelector(".temp"), hilo = row.querySelector(".hilo");
  const where = it.region && it.region !== it.name ? it.region : it.country;
  if (!c) {
    sub.textContent = where + (w ? "" : " · " + (fetching ? "Loading…" : lastFail ? "Couldn't reach Open-Meteo" : "…"));
    temp.textContent = "—"; hilo.textContent = " ";
  } else {
    row.querySelector(".icon").innerHTML = iconSvg(wmoIcon(c.weather_code, c.is_day));
    sub.textContent = where + " · " + wmoText(c.weather_code);
    temp.textContent = c.temperature_2m == null ? "—" : deg(c.temperature_2m);
    const dy = d.daily || {};
    hilo.textContent = dy.temperature_2m_max && dy.temperature_2m_max[0] != null
      ? "H " + deg(dy.temperature_2m_max[0]) + "  L " + deg(dy.temperature_2m_min[0]) : " ";
  }
  if (box.classList.contains("open")) fillDetail(box.querySelector(".detail"), it);
}
function render() {
  const rows = live();
  list.replaceChildren();
  if (!rows.length) list.append(el("div", { id: "empty" }, "No cities — search above to add one."));
  for (const it of rows) {
    const x = el("button", { class: "ghost sm danger x", title: "Remove " + it.name }, "×");
    x.onclick = e => {
      e.stopPropagation();
      if (!x.classList.contains("armed")) { // the desktop's two-click armed ×
        x.classList.add("armed");
        setTimeout(() => x.classList.remove("armed"), 3000);
        return;
      }
      removePlace(it.id);
    };
    const row = el("div", { class: "row" },
      el("span", { class: "tri" }),
      el("div", { class: "icon" }),
      el("div", { class: "who" }, el("div", { class: "city", title: it.tz }, it.name), el("div", { class: "sub" })),
      el("div", { class: "when" }, el("div", { class: "temp" }), el("div", { class: "hilo" })),
      x);
    const box = el("div", { class: "item" + (openIds.has(it.id) ? " open" : ""), "data-id": it.id }, row, el("div", { class: "detail" }));
    row.addEventListener("click", () => {
      box.classList.toggle("open");
      if (box.classList.contains("open")) { openIds.add(it.id); fillDetail(box.querySelector(".detail"), it); }
      else openIds.delete(it.id);
      saveOpen();
    });
    fillItem(box, it);
    list.append(box);
  }
  $("#st-left").textContent = rows.length + (rows.length === 1 ? " city" : " cities");
  statusLine();
}
function statusLine() {
  const t = lastOk ? fmt("hm", { hour: "numeric", minute: "2-digit" }).format(new Date(lastOk)) : "";
  $("#st-right").textContent = fetching ? "Updating…" : lastFail > lastOk ? "Open-Meteo unreachable" + (t ? " · last " + t : "")
    : t ? "Updated " + t : "";
}
function flash(id) {
  const box = list.querySelector(`.item[data-id="${CSS.escape(id)}"]`);
  if (!box) return;
  box.scrollIntoView({ block: "nearest" });
  box.firstChild.classList.add("flash");
  setTimeout(() => box.firstChild.classList.remove("flash"), 900);
}

// ---- the detail: four folding sections under an opened city ----
function section(key, title, note, body) {
  const head = el("div", { class: "sec" + (secOpen[key] ? " open" : "") }, el("span", { class: "tri" }), title, el("span", { class: "n" }, note || ""));
  head.addEventListener("click", () => {
    head.classList.toggle("open");
    secOpen[key] = head.classList.contains("open");
    saveSec();
    // every open city folds the same way
    for (const h of list.querySelectorAll(`.sec[data-key="${key}"]`)) h.classList.toggle("open", secOpen[key]);
  });
  head.dataset.key = key;
  return [head, el("div", { class: "body" }, body)];
}
const kv = pairs => el("div", { class: "kv" }, ...pairs.flatMap(([k, v]) => [el("span", { class: "k" }, k), el("span", { class: "v", title: v }, v)]));
function fillDetail(det, it) {
  const w = wx[it.id], d = w && w.data;
  if (!d) { det.replaceChildren(el("div", { class: "wait" }, fetching ? "Waiting for Open-Meteo…" : "No forecast yet.")); return; }
  const c = d.current, cu = d.current_units || {}, du = d.daily_units || {}, hu = d.hourly_units || {};
  // Now: every current variable, plus when the API says it was measured
  const now = kv([...CURRENT.map(n => [labelOf(n, ""), fmtVal(n, c[n], cu[n], true)]),
    ["As of", clockOf(c.time) + " local, " + (c.interval / 60) + "-minute reading"]]);
  // Place: the geocoder's record and the model's grid point
  const place = kv([
    ["Coordinates", coord(it.lat) + ", " + coord(it.lon)],
    ["Model grid point", coord(d.latitude) + ", " + coord(d.longitude)],
    ["Elevation", (it.elev != null ? num(it.elev) + " m" : "—") + " · model " + num(d.elevation) + " m"],
    ["Time zone", tzLabel(d.timezone, d.timezone_abbreviation, d.utc_offset_seconds)],
    ["Region", it.region || "—"], ["Country", it.country + (it.cc ? " (" + it.cc + ")" : "")],
    ["Population", it.pop != null ? it.pop.toLocaleString() : "—"],
    ["GeoNames", (it.id.startsWith("geo:") ? "#" + it.id.slice(4) : "—") + (it.feature ? " · " + it.feature : "")],
    ["Forecast generated in", num(d.generationtime_ms) + " ms"]]);
  // Daily: seven columns of days, one row per variable
  const days = d.daily.time;
  const dtab = el("table", {}, el("thead", {}, el("tr", {}, el("th", { class: "lab" }, ""), ...days.map(t => el("th", {}, dayOf(t))))),
    el("tbody", {}, ...DAILY.map(n => el("tr", {}, el("th", { class: "lab" }, labelOf(n, du[n])),
      ...days.map((t, i) => el("td", {}, fmtVal(n, d.daily[n] ? d.daily[n][i] : null, du[n])))))));
  // Hourly: the next 48 hours, a day-name row over the hours
  const hours = d.hourly.time, nowIso = (c.time || "").slice(0, 13);
  const dayCells = [];
  for (let i = 0; i < hours.length; i++) {
    const wd = weekdayOf(hours[i]);
    if (dayCells.length && dayCells[dayCells.length - 1].wd === wd) dayCells[dayCells.length - 1].n++;
    else dayCells.push({ wd, n: 1 });
  }
  const dayStart = new Set(); { let i = 0; for (const dc of dayCells) { dayStart.add(i); i += dc.n; } }
  const htab = el("table", {}, el("thead", {},
      el("tr", { class: "days" }, el("th", { class: "lab" }, ""), ...dayCells.map(dc => el("th", { colspan: dc.n }, dc.wd))),
      el("tr", {}, el("th", { class: "lab" }, ""), ...hours.map(t => el("th", {}, hourOf(t))))),
    el("tbody", {}, ...HOURLY.map(n => el("tr", {}, el("th", { class: "lab" }, labelOf(n, hu[n])),
      ...hours.map((t, i) => el("td", { class: (dayStart.has(i) && i ? "day0" : "") + (t.slice(0, 13) === nowIso ? " now" : "") },
        fmtVal(n, d.hourly[n] ? d.hourly[n][i] : null, hu[n])))))));
  det.replaceChildren(
    ...section("now", "Now", CURRENT.length + " fields", now),
    ...section("place", "Place", "", place),
    ...section("daily", "Daily", days.length + " days · " + DAILY.length + " fields", el("div", { class: "tbox" }, dtab)),
    ...section("hourly", "Hourly", hours.length + " hours · " + HOURLY.length + " fields", el("div", { class: "tbox" }, htab)));
}

// ---- city search: Open-Meteo's geocoder ----
const q = $("#q"), drop = $("#drop");
let hot = -1, results = [], searchSeq = 0;
function note(msg) {
  drop.replaceChildren(el("div", { class: "note" }, msg));
  drop.hidden = false;
}
async function search() {
  const raw = q.value.trim();
  if (raw.length < 2) { drop.hidden = true; results = []; hot = -1; return; }
  const seq = ++searchSeq;
  if (!results.length) note("Searching…");
  let found;
  try {
    const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?" + new URLSearchParams({ name: raw, count: 10, language: "en", format: "json" }));
    found = (await r.json()).results || [];
  } catch (e) { if (seq === searchSeq) note("Couldn't reach Open-Meteo"); return; }
  if (seq !== searchSeq || q.value.trim() !== raw) return; // a newer keystroke owns the box
  const have = new Set(live().map(i => i.id));
  results = found.map(placeOf);
  hot = results.length ? 0 : -1;
  if (!results.length) { note("No place matches “" + raw + "”"); return; }
  drop.replaceChildren(...results.map((p, i) => {
    const has = have.has(p.id);
    const o = el("div", { class: "opt" + (i === hot ? " hot" : "") + (has ? " have" : "") },
      el("b", {}, p.name + (p.region ? ", " + p.region : "") + (p.country ? ", " + p.country : "")),
      el("span", { class: "id" }, has ? "added" : p.pop ? p.pop.toLocaleString() : p.cc));
    o.addEventListener("mousedown", e => { e.preventDefault(); pick(i); });
    return o;
  }));
  drop.hidden = false;
  drop.scrollTop = 0;
}
function pick(i) {
  const p = results[i];
  if (!p) return;
  q.value = "";
  drop.hidden = true;
  results = []; hot = -1; searchSeq++;
  if (MOBILE) q.blur(); // let the keyboard go so the new row shows
  addPlace(p);
}
let searchT = null;
q.addEventListener("input", () => { clearTimeout(searchT); searchT = setTimeout(search, 250); });
q.addEventListener("focus", () => { if (q.value.trim()) search(); });
q.addEventListener("blur", () => setTimeout(() => { drop.hidden = true; }, 150));
q.addEventListener("keydown", e => {
  if (drop.hidden || !results.length) { if (e.key === "Escape") { drop.hidden = true; q.value = ""; } return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    hot = e.key === "ArrowDown" ? Math.min(hot + 1, results.length - 1) : Math.max(hot - 1, 0);
    drop.querySelectorAll(".opt").forEach((o, i) => o.classList.toggle("hot", i === hot));
    const o = drop.querySelectorAll(".opt")[hot];
    if (o) o.scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") {
    e.preventDefault(); pick(hot >= 0 ? hot : 0);
  } else if (e.key === "Escape") {
    drop.hidden = true;
  }
});

// ---- desktop window plumbing (same bridge as the other apps) ----
window.addEventListener("pointerdown", () => {
  if (window.parent !== window) parent.postMessage({ exe: "focus" }, location.origin);
}, { capture: true, passive: true });

// no grow box on its own page, nor on a phone, where the window fills the
// screen and the desktop hides its own grow boxes
const grow = $("#grow");
if (window.parent === window || MOBILE) grow.style.display = "none";
if (MOBILE) $("#status").style.paddingRight = "8px";
grow.addEventListener("pointerdown", e => {
  e.preventDefault();
  grow.setPointerCapture(e.pointerId);
  const sx = e.clientX, sy = e.clientY;
  const move = ev =>
    parent.postMessage({ exe: "grow", dx: ev.clientX - sx, dy: ev.clientY - sy }, location.origin);
  const up = () => {
    grow.removeEventListener("pointermove", move);
    grow.removeEventListener("pointerup", up);
    parent.postMessage({ exe: "grow-end" }, location.origin);
  };
  grow.addEventListener("pointermove", move);
  grow.addEventListener("pointerup", up);
  parent.postMessage({ exe: "grow-start" }, location.origin);
});

// OS 9 scrollbar end-merges need the same scrolled/at-end flags as the desktop
document.addEventListener("scroll", e => {
  const t = e.target;
  if (!(t instanceof Element)) return;
  t.classList.toggle("scrolled-y", t.scrollTop >= 1);
  t.classList.toggle("at-y-end", t.scrollTop >= 1 && t.scrollTop >= t.scrollHeight - t.clientHeight - 1);
  t.classList.toggle("scrolled-x", t.scrollLeft >= 1);
  t.classList.toggle("at-x-end", t.scrollLeft >= 1 && t.scrollLeft >= t.scrollWidth - t.clientWidth - 1);
}, { capture: true, passive: true });

// hide/show from the desktop pause and resume the refresh timer; a peer's or
// another window's write (forwarded as data-changed) is merged in
window.addEventListener("message", async e => {
  if (e.origin !== location.origin || !e.data || typeof e.data.exe !== "string") return;
  if (e.data.exe === "hide") {
    paused = true;
    clearTimeout(tickT);
    if (saveT || saving) saveNow(true);
  } else if (e.data.exe === "show") {
    paused = false;
    refresh();
    schedule();
  } else if (e.data.exe === "data-changed") {
    if (e.data.client && e.data.client === CLIENT) return; // our own write
    if (!loaded || e.data.path !== "places.json" || saveT || saving) return;
    try {
      const r = await api(DOC_URL);
      if (r.status === 404) return;
      mergeIn(await r.json());
      render();
      refresh();
    } catch (err) {}
  }
});

// Load the list, retrying a transient failure with backoff. Saves stay
// blocked (loaded=false) until a GET succeeds so a failed load can't clobber
// the stored list with the default city — but a daemon restart must not
// silently disable saving for the whole session, so we keep trying.
let tries = 0;
async function load() {
  try {
    const r = await api(DOC_URL);
    if (r.status === 404) seedDefault();
    else { items = []; mergeIn(await r.json()); }
    loaded = true;
    render();
    refresh();
    schedule();
  } catch (e) {
    console.error("weather load failed:", e);
    if (tries++ < 12) setTimeout(load, 5000);
    // the first attempt still paints the default city so the app is usable
    if (tries === 1) { seedDefault(); render(); refresh(); schedule(); }
  }
}
load();
</script>
</body>
</html>
