<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tides</title>
<link rel="stylesheet" href="/platinum/popup.css">
<style>
/* Platinum values match the exe desktop (macthemes.garden pixel bevels) */
:root {
  --black: #262626;
  --g200: #eee; --g300: #ddd; --g400: #ccc; --g500: #bbb; --g600: #999;
  --hl: #333399;
  --font: "Charcoal", "Chicago", "Geneva", "Lucida Grande", "Lucida Sans", Geneva, Verdana, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 12px/1.45 var(--font); color: var(--black); background: var(--g200);
  user-select: none; cursor: default; overflow: hidden; display: flex; flex-direction: column; }

#bar { display: flex; gap: 8px; padding: 10px 10px 8px; align-items: center; }
input[type=text] { background: #fff; color: var(--black);
  border: 1px solid var(--black); border-radius: 0; padding: 2px 5px; font: inherit; font-size: 12px;
  height: 20px; line-height: 14px;
  box-shadow: -1px -1px 0 var(--g600), -1px 0 0 var(--g600), 0 -1px 0 var(--g600),
    1px 1px 0 #fff, 1px 0 0 #fff, 0 1px 0 #fff; }
input[type=text]:focus { outline: 2px solid #9999fe; outline-offset: 0; }

button { font: inherit; cursor: default; }
button.ghost { background: var(--g300); color: var(--black);
  border: 1px solid var(--black); border-radius: 3px;
  padding: 2px 13px; font-size: 12px; line-height: 14px; font-weight: bold; height: 20px;
  box-shadow: inset 1px 1px 0 var(--g300), inset -1px -1px 0 #777,
    inset 2px 2px 0 #fff, inset -2px -2px 0 #aaa; }
button.ghost:active { background: #666; color: #fff;
  box-shadow: inset 1px 1px 0 #444, inset -1px -1px 0 #888,
    inset 2px 2px 0 #555, inset -2px -2px 0 #777; }
/* the selected range stays depressed, like a Platinum segmented control */
button.ghost.on { background: #888; color: #fff;
  box-shadow: inset 1px 1px 0 #666, inset -1px -1px 0 #aaa,
    inset 2px 2px 0 #777, inset -2px -2px 0 #999; }
#seg { display: flex; gap: 0; }
#seg button { border-radius: 0; border-right-width: 0; }
#seg button:first-child { border-radius: 3px 0 0 3px; }
#seg button:last-child { border-radius: 0 3px 3px 0; border-right-width: 1px; }

#loc-wrap { position: relative; flex: 1; min-width: 0; }
#loc { width: 100%; }
#drop { position: absolute; left: 0; right: 0; top: 21px; z-index: 5;
  background: #fff; border: 1px solid var(--black); box-shadow: 2px 2px 0 rgba(0,0,0,.35);
  max-height: 208px; overflow-y: auto; overflow-x: hidden; }
#drop .opt { padding: 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#drop .opt .id { color: #777; font-size: 10px; margin-left: 4px; }
#drop .opt.hot, #drop .opt:hover { background: var(--hl); color: #fff; }
#drop .opt.hot .id, #drop .opt:hover .id { color: #ccf; }
#drop .note { padding: 4px 6px; color: #555; font-size: 11px; }

/* The pop-up menu button is the shared block the daemon serves
   (/platinum/popup.css, exe-stats popup.css): linked above, never copied. */
#units-wrap { flex: none; width: 52px; }

/* chart is a document area: flush left/right/bottom, separator on top */
#chart-box { flex: 1; position: relative; background: #fff; border-top: 1px solid var(--black);
  min-height: 0; }
/* canvas is a replaced element: inset alone doesn't stretch it */
#cv { position: absolute; inset: 0; width: 100%; height: 100%; }
#tip { position: absolute; z-index: 4; pointer-events: none; background: #ffffcc;
  border: 1px solid var(--black); box-shadow: 1px 1px 0 rgba(0,0,0,.35);
  font-size: 10px; line-height: 1.3; padding: 2px 6px; white-space: nowrap; display: none; }

/* 15px total (1px border + 14px face), same as the desktop's Daemon Log /
   Chat statusbars: the 15px grow tile at bottom:0 then puts its black top
   row exactly on this border-top line and its face merges into the host
   chrome through the .window.grow corner punch-outs — every seam one line */
/* overflow: clip — the 11px text's line box is taller than the 14px face and
   hangs a pixel past the bar; clipped, that pixel is no scrollable overflow of
   the page (docs/platinum.md, status bar) */
#status { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--black);
  background: var(--g300); font-size: 11px; color: #333; padding: 0 20px 0 8px; height: 15px;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,.6), inset -1px -1px 0 #aaa; overflow: clip; }
#st-station { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#st-next { flex: none; }

#grow { position: fixed; right: 0; bottom: 0; width: 15px; height: 15px;
  touch-action: none; z-index: 6; }

/* Mac OS 9 scrollbars — the desktop's pixel-sampled spec, adapted for a
   document window: the host frame draws the outer black line, so bars are
   15px (1px leading separator + the sampled 14px face) with no trailing
   border of their own — otherwise the edge doubles to 2px. */
::-webkit-scrollbar { width: 15px; height: 15px; }
::-webkit-scrollbar-track:vertical { border-left: 1px solid var(--black);
  background: linear-gradient(to right, #777 0, #777 1px, #888 1px, #888 2px, #aaa 2px, #aaa 12px, #bbb 12px, #bbb 13px, #ccc 13px, #ccc 14px); }
::-webkit-scrollbar-thumb:vertical { border: 1px solid var(--black); border-right: 0;
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="8" shape-rendering="crispEdges"><rect x="3" y="0" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="0" width="6" height="1" fill="%23ccccff"/><rect x="4" y="1" width="7" height="1" fill="%23333399"/><rect x="3" y="2" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="2" width="6" height="1" fill="%23ccccff"/><rect x="4" y="3" width="7" height="1" fill="%23333399"/><rect x="3" y="4" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="4" width="6" height="1" fill="%23ccccff"/><rect x="4" y="5" width="7" height="1" fill="%23333399"/><rect x="3" y="6" width="1" height="1" fill="%23eeeeee"/><rect x="4" y="6" width="6" height="1" fill="%23ccccff"/><rect x="4" y="7" width="7" height="1" fill="%23333399"/></svg>') center no-repeat,
    linear-gradient(to right, #ccccff 0 1px, #9999ff 1px 13px, #6666cc 13px 14px);
  box-shadow: inset 0 1px 0 #ccccff, inset 0 -1px 0 #6666cc; }
::-webkit-scrollbar-thumb:vertical:active {
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="8" shape-rendering="crispEdges"><rect x="3" y="0" width="1" height="1" fill="%23ccccff"/><rect x="4" y="0" width="6" height="1" fill="%239999ff"/><rect x="4" y="1" width="7" height="1" fill="%23000066"/><rect x="3" y="2" width="1" height="1" fill="%23ccccff"/><rect x="4" y="2" width="6" height="1" fill="%239999ff"/><rect x="4" y="3" width="7" height="1" fill="%23000066"/><rect x="3" y="4" width="1" height="1" fill="%23ccccff"/><rect x="4" y="4" width="6" height="1" fill="%239999ff"/><rect x="4" y="5" width="7" height="1" fill="%23000066"/><rect x="3" y="6" width="1" height="1" fill="%23ccccff"/><rect x="4" y="6" width="6" height="1" fill="%239999ff"/><rect x="4" y="7" width="7" height="1" fill="%23000066"/></svg>') center no-repeat,
    linear-gradient(to right, #9999ff 0 1px, #6666cc 1px 13px, #333399 13px 14px);
  box-shadow: inset 0 1px 0 #9999ff, inset 0 -1px 0 #333399; }
:not(.scrolled-y)::-webkit-scrollbar-thumb:vertical {
  border-top-color: #ccccff; box-shadow: inset 0 -1px 0 #6666cc; }
:not(.scrolled-y)::-webkit-scrollbar-thumb:vertical:active {
  border-top-color: #9999ff; box-shadow: inset 0 -1px 0 #333399; }
.at-y-end::-webkit-scrollbar-thumb:vertical {
  border-bottom-color: #6666cc; box-shadow: inset 0 1px 0 #ccccff; }
.at-y-end::-webkit-scrollbar-thumb:vertical:active {
  border-bottom-color: #333399; box-shadow: inset 0 1px 0 #9999ff; }
::-webkit-scrollbar-button { display: block; width: 16px; height: 16px;
  background: #ddd; border: 1px solid var(--black);
  box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #bbb;
  background-position: center; background-repeat: no-repeat; }
::-webkit-scrollbar-button:vertical { border-right: 0; }
::-webkit-scrollbar-button:vertical:end:increment:enabled { height: 14px; border-top: 0; border-bottom: 0; }
::-webkit-scrollbar-button:vertical:decrement {
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="4" shape-rendering="crispEdges"><path fill="black" d="M3 0h2v1h-2z M2 1h4v1h-4z M1 2h6v1h-6z M0 3h8v1h-8z"/></svg>'); }
::-webkit-scrollbar-button:vertical:increment {
  background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="4" shape-rendering="crispEdges"><path fill="black" d="M0 0h8v1h-8z M1 1h6v1h-6z M2 2h4v1h-4z M3 3h2v1h-2z"/></svg>'); }
::-webkit-scrollbar-button:active { background-color: #777;
  box-shadow: inset 1px 1px 0 #555, inset -1px -1px 0 #999; }
::-webkit-scrollbar-button:vertical:start:decrement,
::-webkit-scrollbar-button:vertical:start:increment,
::-webkit-scrollbar-button:horizontal:start:decrement,
::-webkit-scrollbar-button:horizontal:start:increment { display: none; }
::-webkit-scrollbar-corner { background: var(--g300); }
</style>
</head>
<body>

<div id="bar">
  <div id="seg">
    <button class="ghost" data-range="1">Today</button>
    <button class="ghost" data-range="3">3 Days</button>
    <button class="ghost" data-range="7">7 Days</button>
  </div>
  <div id="loc-wrap">
    <input type="text" id="loc" placeholder="Search location…" autocomplete="off" spellcheck="false">
    <div id="drop" hidden></div>
  </div>
  <span class="popup" id="units-wrap"><select id="units" title="Temperature">
    <option value="c">°C</option>
    <option value="f">°F</option>
  </select><span class="well"><i><b></b></i></span></span>
</div>
<div id="chart-box">
  <canvas id="cv"></canvas>
  <div id="tip"></div>
</div>
<div id="status">
  <span id="st-station">…</span>
  <span id="st-next"></span>
</div>
<!-- grow box sampled pixel-for-pixel from Mac OS 9 (Infinite Mac) -->
<svg id="grow" width="15" height="15" viewBox="0 0 15 15" shape-rendering="crispEdges">
  <rect width="15" height="15" fill="#ccc"/>
  <path fill="#000" d="M0 0h15v1H0zM0 1h1v14H0z"/>
  <path fill="#fff" d="M1 1h14v1H1zM1 2h1v13H1z"/>
  <path fill="#fff" d="M9 4h2v1H9zM8 5h1v1H8zM7 6h1v1H7zM6 7h1v1H6zM5 8h1v1H5zM4 9h1v1H4zM11 6h2v1h-2zM10 7h1v1h-1zM9 8h1v1H9zM8 9h1v1H8zM7 10h1v1H7zM6 11h1v1H6zM13 8h2v1h-2zM12 9h1v1h-1zM11 10h1v1h-1zM10 11h1v1h-1zM9 12h1v1H9zM8 13h1v1H8z"/>
  <path fill="#777" d="M10 5h1v1h-1zM9 6h1v1H9zM8 7h1v1H8zM7 8h1v1H7zM6 9h1v1H6zM5 10h1v1H5zM12 7h1v1h-1zM11 8h1v1h-1zM10 9h1v1h-1zM9 10h1v1H9zM8 11h1v1H8zM7 12h1v1H7zM14 9h1v1h-1zM13 10h1v1h-1zM12 11h1v1h-1zM11 12h1v1h-1zM10 13h1v1h-1zM9 14h1v1H9z"/>
  <path fill="#aaa" d="M4 10h1v1H4zM6 12h1v1H6zM8 14h1v1H8z"/>
</svg>

<script>
"use strict";
const $ = s => document.querySelector(s);

// The desktop passes its API token in the iframe URL; the app name comes
// from the path so a renamed bundle folder keeps working.
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const APP = decodeURIComponent(location.pathname.split("/")[2] || "Tides");
const SETTINGS_URL = "/v1/apps/" + encodeURIComponent(APP) + "/data/settings.json";
// identifies this window's writes so the daemon's change events can be
// echo-suppressed here (we made the write) but delivered to other windows
const CLIENT = Math.random().toString(36).slice(2) + Date.now().toString(36);

// NOAA CO-OPS: predictions in GMT (converted to the viewer's clock for
// display, so "Today" and the now-line are exact in any timezone) from the
// data API; the station directory comes from the metadata API. Both send
// Access-Control-Allow-Origin: * — no proxy needed.
const NOAA = "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter";
const MDAPI = "https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations.json?type=tidepredictions";
const MDAPI_ONE = "https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations/";
const DEFAULT_STATION = { id: "9410580", name: "Newport Bay Entrance, Corona del Mar", state: "CA", type: "R",
  lat: 33.6033, lon: -117.883 };
// Open-Meteo: the hourly temperature and conditions at the station's
// position (CORS open, no key), asked in °C and GMT unix seconds; the
// °C/°F menu converts here, so switching never refetches
const METEO = "https://api.open-meteo.com/v1/forecast";
const WX_FRESH = 30 * 60000;

async function api(url, opts = {}) {
  opts.headers = Object.assign({}, opts.headers);
  if (TOKEN) opts.headers["Authorization"] = "Bearer " + TOKEN;
  opts.headers["X-Exe-Client"] = CLIENT;
  const r = await fetch(url, opts);
  if (!r.ok && r.status !== 404) throw new Error("HTTP " + r.status);
  return r;
}

let st = { station: DEFAULT_STATION, range: 1 };
let curve = [];        // [{t: ms, v: ft}] the drawn water line
let extremes = [];     // [{t: ms, v: ft, type: "H"|"L"}] incl. a day beyond each edge
let loadErr = "";
let fetchedKey = "";   // station|range|startMs of the data on screen
let stations = null;   // slim searchable list
let wx = null;         // {key: station|startMs, at, t: [ms], c: [°C], code: [], day: []} hourly, the whole week

// Debounced whole-doc PUT, serialized so a slow write is never overtaken;
// saves stay blocked until the initial GET settled so a failed load can't
// be clobbered with the default station. keepalive on flush survives the
// desktop tearing the iframe down mid-debounce.
let saveT = null, saving = false, again = false, loaded = false;
function saveSettings() {
  if (!loaded) return;
  clearTimeout(saveT);
  saveT = setTimeout(saveNow, 250);
}
// X-Exe-Seq stamps count upward whatever the clock does: two snapshots in one
// millisecond (a debounced save, then the unload flush right behind it) or a
// clock set back would otherwise carry a stamp the daemon has already taken,
// and the newer text be the one answered stale.
let lastSeq = 0;
const nextSeq = () => (lastSeq = Math.max(Date.now(), lastSeq + 1));
async function saveNow(flush) {
  clearTimeout(saveT); saveT = null;
  const body = JSON.stringify({ station: st.station, range: st.range }, null, 2);
  // X-Exe-Seq is a content timestamp: the daemon drops a PUT older than one
  // it already stored, so an in-flight save can't land stale over the flush.
  const seq = { "X-Exe-Seq": String(nextSeq()) };
  if (flush) {
    // unload: fire a keepalive PUT bypassing the in-flight gate, so the flush
    // isn't swallowed by `again` and an in-flight non-keepalive PUT can't be
    // aborted as the iframe is torn down
    try { api(SETTINGS_URL, { method: "PUT", keepalive: true, headers: seq, body }); } catch (e) {}
    return;
  }
  if (saving) { again = true; return; }
  saving = true;
  try {
    await api(SETTINGS_URL, { method: "PUT", headers: seq, body });
  } catch (e) { console.error("tides save failed:", e); }
  saving = false;
  if (again) { again = false; saveNow(); }
}
addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && (saveT || saving)) saveNow(true);
  else if (document.visibilityState === "visible" && !paused) tick(); // a throttled tab catches up
});
addEventListener("pagehide", () => { if (saveT || saving) saveNow(true); });

// ---- time helpers ----
const pad2 = n => String(n).padStart(2, "0");
const DAY = 86400000;
function gmtParam(d) {
  return d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()) +
    " " + pad2(d.getUTCHours()) + ":" + pad2(d.getUTCMinutes());
}
const parseGmt = s => Date.parse(s.replace(" ", "T") + ":00Z");
function rangeSpan() {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  return { start, end: start + st.range * DAY };
}
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function fmtClock(t) {
  const d = new Date(t);
  let h = d.getHours() % 12; if (h === 0) h = 12;
  return h + ":" + pad2(d.getMinutes()) + " " + (d.getHours() < 12 ? "AM" : "PM");
}
const fmtDay = t => { const d = new Date(t); return WD[d.getDay()] + " " + (d.getMonth() + 1) + "/" + d.getDate(); };
const fmtFt = v => (Math.abs(v) < 0.05 ? 0 : v).toFixed(1); // never "-0.0"

// ---- NOAA fetches ----
async function noaa(extra) {
  const q = new URLSearchParams(Object.assign({
    product: "predictions", application: "exe-tides", datum: "MLLW",
    time_zone: "gmt", units: "english", format: "json", station: st.station.id,
  }, extra));
  const r = await fetch(NOAA + "?" + q);
  if (!r.ok) throw new Error("NOAA HTTP " + r.status);
  const d = await r.json();
  if (d.error) throw new Error(d.error.message || "no data");
  return d.predictions || [];
}

// Subordinate stations only publish high/low times, so the water line is the
// standard cosine interpolation between consecutive extremes.
function cosineCurve(ex, start, end) {
  const pts = [];
  for (let i = 0; i < ex.length - 1; i++) {
    const a = ex[i], b = ex[i + 1];
    if (b.t < start || a.t > end) continue;
    for (let t = Math.max(a.t, start); t <= Math.min(b.t, end); t += 360000) {
      const f = (1 - Math.cos(Math.PI * (t - a.t) / (b.t - a.t))) / 2;
      pts.push({ t, v: a.v + (b.v - a.v) * f });
    }
  }
  return pts;
}

async function loadTides() {
  const { start, end } = rangeSpan();
  const key = st.station.id + "|" + st.range + "|" + start;
  fetchedKey = key;
  loadErr = "";
  loadWeather();
  $("#st-station").textContent = stationLabel() + " — loading…";
  try {
    // extremes a day past each edge: they anchor the interpolated curve and
    // the "next tide" readout even at the range boundary
    const hiloP = noaa({ interval: "hilo",
      begin_date: gmtParam(new Date(start - DAY)), end_date: gmtParam(new Date(end + DAY)) });
    let six = null;
    try {
      six = await noaa({ interval: "6", begin_date: gmtParam(new Date(start)), end_date: gmtParam(new Date(end)) });
    } catch (e) { /* subordinate station: fall back to interpolation */ }
    const hilo = await hiloP;
    if (fetchedKey !== key) return; // a newer request superseded this one
    extremes = hilo.map(p => ({ t: parseGmt(p.t), v: +p.v, type: p.type }));
    curve = six ? six.map(p => ({ t: parseGmt(p.t), v: +p.v })) : cosineCurve(extremes, start, end);
  } catch (e) {
    if (fetchedKey !== key) return;
    curve = []; extremes = [];
    loadErr = e.message;
  }
  draw();
  updateStatus();
}

// ---- weather at the station ----
// A station picked from the list carries its position; one saved before
// Tides showed weather is looked up once in NOAA's metadata and kept in
// memory (the next save stores it — never a write of its own).
async function ensureCoords(s) {
  if (Number.isFinite(s.lat) && Number.isFinite(s.lon)) return s;
  const r = await fetch(MDAPI_ONE + encodeURIComponent(s.id) + ".json");
  if (!r.ok) throw new Error("station HTTP " + r.status);
  const m = ((await r.json()).stations || [])[0];
  if (!m || !Number.isFinite(+m.lat) || !Number.isFinite(+m.lng)) throw new Error("station has no position");
  s.lat = +m.lat; s.lon = +m.lng;
  return s;
}

// One call covers the whole week from today's midnight whatever the range,
// so the range buttons never wait on it; it is asked again every half hour
// (the minute tick) and when the day or the station changes. Another
// station's weather is dropped at once rather than shown on this one.
let wxBusy = "";
const isoHour = ms => new Date(ms - ms % 3600000).toISOString().slice(0, 16);
async function loadWeather() {
  const { start } = rangeSpan(), s = st.station, key = s.id + "|" + start;
  if (wx && wx.key.split("|")[0] !== s.id) wx = null;
  if (wxBusy === key || (wx && wx.key === key && Date.now() - wx.at < WX_FRESH)) return;
  wxBusy = key;
  try {
    await ensureCoords(s);
    const q = new URLSearchParams({ latitude: s.lat, longitude: s.lon, hourly: "temperature_2m,weather_code,is_day",
      timeformat: "unixtime", timezone: "GMT", start_hour: isoHour(start - 3600000), end_hour: isoHour(start + 7 * DAY + 7200000) });
    const r = await fetch(METEO + "?" + q);
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.reason || "HTTP " + r.status);
    if (st.station.id + "|" + rangeSpan().start !== key) return; // superseded
    const h = d.hourly || {};
    wx = { key, at: Date.now(), t: (h.time || []).map(x => x * 1000), c: h.temperature_2m || [],
      code: h.weather_code || [], day: h.is_day || [] };
    draw();
  } catch (e) {
    console.error("tides weather failed:", e);
  } finally {
    if (wxBusy === key) wxBusy = "";
  }
}
// the weather at a moment: temperature between the hours, conditions of the
// nearest hour; null outside the fetched week or for a missing reading
function wxAt(t) {
  if (!wx || wx.key.split("|")[0] !== st.station.id) return null;
  const T = wx.t, n = T.length;
  if (n < 2 || t < T[0] || t > T[n - 1]) return null;
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; (T[m] <= t ? lo = m : hi = m); }
  const a = wx.c[lo], b = wx.c[hi], f = (t - T[lo]) / (T[hi] - T[lo]);
  const i = f < 0.5 ? lo : hi;

// Each icon is painted once per device pixel ratio into a sprite of its
// own, every art pixel's edges snapped to whole device pixels (crispEdges
// at 1.5x), then stamped at a whole device pixel.
const sprites = {};
function sprite(kind, dpr) {
  const k = kind + "@" + dpr;
  if (sprites[k]) return sprites[k];
  const n = Math.round(32 * dpr), c = document.createElement("canvas");
  c.width = c.height = n;
  const g = c.getContext("2d"), snap = v => Math.round(v * dpr);
  for (const m of (ART[kind] || ART.unknown).matchAll(/fill="([^"]+)" d="([^"]+)"/g)) {
    g.fillStyle = m[1];
    for (const r of m[2].matchAll(/M(\d+) (\d+)h(\d+)v(\d+)/g)) {
      const x = +r[1], y = +r[2];
      g.fillRect(snap(x), snap(y), snap(x + +r[3]) - snap(x), snap(y + +r[4]) - snap(y));
    }
  }
  return sprites[k] = c;
}
function drawIcon(kind, x, y) {
  const dpr = devicePixelRatio || 1;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(sprite(kind, dpr), Math.round(x * dpr), Math.round(y * dpr));
  ctx.restore();
}

function stationLabel() {
  return st.station.name + (st.station.state ? ", " + st.station.state : "");
}

function updateStatus() {
  $("#st-station").textContent = stationLabel() + "  ·  " + st.station.id;
  const now = Date.now();
  const next = extremes.find(e => e.t > now);
  $("#st-next").textContent = loadErr ? "" :
    next ? "Next: " + (next.type === "H" ? "High" : "Low") + " " + fmtFt(next.v) +
      " ft at " + fmtClock(next.t) + "  ·  ft MLLW" : "ft MLLW";
}

// ---- chart ----
const box = $("#chart-box"), cv = $("#cv"), ctx = cv.getContext("2d");
const M = { l: 32, r: 10, t: 16, b: 20 };

// What each high/low marker carries outward from its dot (above a high,
// below a low): its height, its clock (not at 7 days), then the weather —
// the temperature, and past it the condition icon while neighbouring
// markers stand an icon apart and the plot has the height; the temperature
// alone when not, nothing when even that would crowd. The y scale keeps
// that much room past the highest high and the lowest low, so every stack
// fits, and the room is kept before the forecast lands so nothing moves.
const ICON = 32;
function plan(W, H) {
  const { start, end } = rangeSpan();
  const exIn = extremes.filter(e => e.t >= start && e.t <= end);
  let lo = Infinity, hi = -Infinity;
  for (const p of curve) { if (p.v < lo) lo = p.v; if (p.v > hi) hi = p.v; }
  for (const e of exIn) { if (e.v < lo) lo = e.v; if (e.v > hi) hi = e.v; }
  const X = t => M.l + (t - start) / (end - start) * (W - M.l - M.r);
  // highs stack on one side and lows on the other: the narrowest gap
  // between two neighbouring highs, or two lows, is what the stacks share
  let gap = Infinity;
  for (const type of ["H", "L"]) {
    const xs = exIn.filter(e => e.type === type).map(e => X(e.t));
    for (let i = 1; i < xs.length; i++) gap = Math.min(gap, xs[i] - xs[i - 1]);
  }
  const text = st.range < 7 ? 27 : 18; // a low's height and clock reach this far below its dot
  const plot = H - M.t - M.b;
  const tier = [
    { wx: "icon", top: 68, bot: text + 45, gap: ICON + 2, band: 90 },
    { wx: "temp", top: 36, bot: text + 12, gap: 20, band: 40 },
  ].find(t => gap >= t.gap && plot - t.top - t.bot >= t.band) || { wx: "", top: 26, bot: text + 2 };
  // the water between the reserves; a range under a foot sits centred
  const y0 = M.t + tier.top, y1 = Math.max(y0 + 1, H - M.b - tier.bot);
  const k = (y1 - y0) / Math.max(hi - lo, 1), mid = (hi + lo) / 2;
  const Y = v => (y0 + y1) / 2 + (mid - v) * k;
  const V = y => mid - (y - (y0 + y1) / 2) / k;
  return { start, end, exIn, X, Y, k, vtop: V(M.t), vbot: V(H - M.b), wx: tier.wx };
}

function draw() {
  const W = box.clientWidth, H = box.clientHeight, dpr = devicePixelRatio || 1;
  if (W < 40 || H < 40) return;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.textBaseline = "alphabetic";

  if (!curve.length) {
    ctx.fillStyle = "#555"; ctx.font = "11px Geneva, Verdana, sans-serif"; ctx.textAlign = "center";
    ctx.fillText(loadErr ? "No tide data: " + loadErr : "Loading…", W / 2, H / 2);
    return;
  }

  const P = plan(W, H), { start, end, X, Y } = P;

  // vertical grid: 3-hour lines for a single day, midnights across several
  ctx.font = "9px Geneva, Verdana, sans-serif";
  ctx.textAlign = "center";
  if (st.range === 1) {
    for (let h = 3; h < 24; h += 3) {
      const t = start + h * 3600000, x = Math.round(X(t)) + .5;
      ctx.strokeStyle = "#e4e4e4";
      ctx.beginPath(); ctx.moveTo(x, M.t); ctx.lineTo(x, H - M.b); ctx.stroke();
      ctx.fillStyle = "#555";
      const lbl = h === 12 ? "12PM" : (h % 12) + (h < 12 ? "AM" : "PM");
      ctx.fillText(lbl, x, H - M.b + 13);
    }
    ctx.fillStyle = "#555";
    ctx.textAlign = "left"; ctx.fillText("12AM", M.l + 2, H - M.b + 13); ctx.textAlign = "center";
  } else {
    for (let d = 0; d < st.range; d++) {
      const t = start + d * DAY, x = Math.round(X(t)) + .5;
      if (d > 0) {
        ctx.strokeStyle = "#d4d4d4";
        ctx.beginPath(); ctx.moveTo(x, M.t); ctx.lineTo(x, H - M.b); ctx.stroke();
      }
      if (st.range === 3) {
        const xn = Math.round(X(t + DAY / 2)) + .5;
        ctx.strokeStyle = "#efefef";
        ctx.beginPath(); ctx.moveTo(xn, M.t); ctx.lineTo(xn, H - M.b); ctx.stroke();
      }
      ctx.fillStyle = "#555";
      ctx.fillText(fmtDay(t), X(t + DAY / 2), H - M.b + 13);
    }
  }

  // water: solid Platinum lavender under a 2px highlight-blue line
  ctx.beginPath();
  curve.forEach((p, i) => { const x = X(p.t), y = Y(p.v); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.lineTo(X(curve[curve.length - 1].t), H - M.b);
  ctx.lineTo(X(curve[0].t), H - M.b);
  ctx.closePath();
  ctx.fillStyle = "#ccccff";
  ctx.fill();
  ctx.beginPath();
  curve.forEach((p, i) => { const x = X(p.t), y = Y(p.v); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.strokeStyle = "#333399"; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.stroke();
  ctx.lineWidth = 1;

  // horizontal grid over the water so depth stays readable, labels in ink;
  // whole feet, or every 2, 5 or 10 where the lines would crowd
  const step = P.k >= 14 ? 1 : P.k >= 7 ? 2 : P.k >= 3 ? 5 : 10;
  ctx.textAlign = "right";
  for (let v = Math.ceil(P.vbot / step) * step; v <= P.vtop; v += step) {
    const y = Math.round(Y(v)) + .5;
    ctx.strokeStyle = v === 0 ? "rgba(0,0,0,.28)" : "rgba(0,0,0,.10)";
    ctx.beginPath(); ctx.moveTo(M.l, y); ctx.lineTo(W - M.r, y); ctx.stroke();
    ctx.fillStyle = "#555";
    ctx.fillText(String(v), M.l - 5, y + 3);
  }
  ctx.fillStyle = "#555"; ctx.fillText("ft", M.l - 5, M.t - 5);

  // frame line at the bottom of the plot
  ctx.strokeStyle = "#999";
  ctx.beginPath(); ctx.moveTo(M.l, Math.round(H - M.b) + .5); ctx.lineTo(W - M.r, Math.round(H - M.b) + .5); ctx.stroke();

  // high/low markers: the chart's only direct labels (dataviz: selective).
  // Labels clamp inside the plot: lows sit close to the bottom edge and
  // their text would otherwise run into the hour band or off the canvas.
  ctx.textAlign = "center";
  for (const e of P.exIn) {
    const x = X(e.t), y = Y(e.v);
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.strokeStyle = "#333399"; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
    const above = e.type === "H";
    const edge = P.wx === "icon" ? ICON / 2 : 12;
    const lx = Math.min(Math.max(x, M.l + edge), W - M.r - edge);
    const vy = above ? Math.max(y - 16, M.t + 10) : Math.min(y + 16, H - M.b - 11);
    ctx.fillStyle = "#262626";
    ctx.font = "bold 10px Geneva, Verdana, sans-serif";
    ctx.fillText(fmtFt(e.v), lx, vy);
    let by = vy + 2; // the foot of the tide text
    if (st.range < 7) {
      ctx.fillStyle = "#555";
      ctx.font = "9px Geneva, Verdana, sans-serif";
      ctx.fillText(fmtClock(e.t).replace(" ", ""), lx, vy + 9);
      by = vy + 11;
    }
    // the weather, past the tide text; its room stays empty until it lands
    const w = P.wx && wxAt(e.t);
    if (w) {
      const ty = above ? vy - 11 : by + 9; // the temperature's baseline
      ctx.fillStyle = "#262626";
      ctx.font = "10px Geneva, Verdana, sans-serif";
      ctx.fillText(fmtTemp(w.c), lx, ty);
      if (P.wx === "icon")
        drawIcon(wmoIcon(w.code, w.day), Math.round(lx - ICON / 2), Math.round(above ? ty - 9 - ICON : ty + 3));
    }
  }

  // now-line with a dot riding the water line
  const now = Date.now();
  if (now >= start && now <= end) {
    const x = Math.round(X(now)) + .5;
    ctx.strokeStyle = "#cc0000";
    ctx.beginPath(); ctx.moveTo(x, M.t); ctx.lineTo(x, H - M.b); ctx.stroke();
    const v = valueAt(now);
    if (v != null) {
      ctx.beginPath(); ctx.arc(X(now), Y(v), 3, 0, Math.PI * 2);
      ctx.fillStyle = "#cc0000"; ctx.fill();
      ctx.fillStyle = "#cc0000"; ctx.font = "9px Geneva, Verdana, sans-serif";
      // height, clock and temperature, in the chart's compact clock form,
      // in the margin over the plot (on the "ft" line), where no marker's
      // stack reaches; right of the line until it would run past the plot,
      // then on its left
      const w = wxAt(now);
      const label = fmtFt(v) + " ft now · " + fmtClock(now).replace(" ", "") + (w ? " · " + fmtTemp(w.c) : "");
      const flip = x + 4 + ctx.measureText(label).width > W - M.r;
      ctx.textAlign = flip ? "right" : "left";
      ctx.fillText(label, x + (flip ? -4 : 4), M.t - 5);
    }
  }
  drawHover(P);
}

function valueAt(t) {
  if (!curve.length || t < curve[0].t || t > curve[curve.length - 1].t) return null;
  let lo = 0, hi = curve.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; (curve[m].t <= t ? lo = m : hi = m); }
  const a = curve[lo], b = curve[hi];
  return b.t === a.t ? a.v : a.v + (b.v - a.v) * (t - a.t) / (b.t - a.t);
}

// ---- hover: crosshair + balloon tooltip ----
let hover = null; // {x,y,t,v} in CSS px
const tip = $("#tip");
cv.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect();
  const { start, end } = rangeSpan();
  const W = box.clientWidth;
  const t = start + (e.clientX - r.left - M.l) / (W - M.l - M.r) * (end - start);
  const v = valueAt(t);
  if (v == null || e.clientX - r.left < M.l) { clearHover(); return; }
  hover = { x: e.clientX - r.left, t, v };
  const w = wxAt(t);
  tip.textContent = (st.range > 1 ? fmtDay(t) + " " : "") + fmtClock(t) + " · " + v.toFixed(2) + " ft" +
    (w ? " · " + fmtTemp(w.c) + " " + wmoText(w.code) : "");
  tip.style.display = "block";
  const tw = tip.offsetWidth;
  tip.style.left = Math.max(4, Math.min(hover.x + 10, box.clientWidth - tw - 4)) + "px";
  tip.style.top = Math.max(4, e.clientY - r.top - 26) + "px";
  draw();
});
cv.addEventListener("mouseleave", clearHover);
function clearHover() {
  if (!hover) return;
  hover = null; tip.style.display = "none"; draw();
}
function drawHover(P) {
  if (!hover) return;
  const H = box.clientHeight;
  const x = Math.round(hover.x) + .5;
  ctx.strokeStyle = "#888"; ctx.setLineDash([2, 2]);
  ctx.beginPath(); ctx.moveTo(x, M.t); ctx.lineTo(x, H - M.b); ctx.stroke();
  ctx.setLineDash([]);
  // dot on the water line at the hovered time
  ctx.beginPath(); ctx.arc(hover.x, P.Y(hover.v), 3.5, 0, Math.PI * 2);
  ctx.fillStyle = "#fff"; ctx.fill();
  ctx.strokeStyle = "#262626"; ctx.stroke();
}

// ---- range control ----
function syncSeg() {
  document.querySelectorAll("#seg button").forEach(b =>
    b.classList.toggle("on", +b.dataset.range === st.range));
}
document.querySelectorAll("#seg button").forEach(b => b.addEventListener("click", () => {
  st.range = +b.dataset.range;
  syncSeg(); saveSettings(); loadTides();
}));

// ---- station search ----
const loc = $("#loc"), drop = $("#drop");
let hot = -1, results = [];

async function ensureStations() {
  if (stations) return stations;
  // v2 carries each station's position, for its weather; v1 lacked it
  try {
    localStorage.removeItem("tides-stations-v1");
    const c = JSON.parse(localStorage.getItem("tides-stations-v2"));
    if (c && Date.now() - c.at < 7 * DAY && Array.isArray(c.list)) return stations = c.list;
  } catch (e) {}
  const r = await fetch(MDAPI);
  if (!r.ok) throw new Error("station list HTTP " + r.status);
  const d = await r.json();
  stations = (d.stations || []).map(s => {
    const o = { id: s.id, name: s.name, state: s.state || "", type: s.type };
    if (Number.isFinite(s.lat) && Number.isFinite(s.lng)) { o.lat = s.lat; o.lon = s.lng; }
    return o;
  });
  try { localStorage.setItem("tides-stations-v2", JSON.stringify({ at: Date.now(), list: stations })); } catch (e) {}
  return stations;
}

function note(msg) {
  drop.replaceChildren(Object.assign(document.createElement("div"), { className: "note", textContent: msg }));
  drop.hidden = false;
}

async function search() {
  const q = loc.value.trim().toLowerCase();
  if (q.length < 2) { drop.hidden = true; results = []; hot = -1; return; }
  try {
    if (!stations) note("Loading NOAA station list…");
    await ensureStations();
  } catch (e) { note("Station list unavailable: " + e.message); return; }
  const terms = q.split(/\s+/);
  results = stations.filter(s => {
    const hay = (s.name + " " + s.state + " " + s.id).toLowerCase();
    return terms.every(t => hay.includes(t));
  });
  // reference stations first (real 6-minute curves), then name matches
  results.sort((a, b) =>
    (a.name.toLowerCase().startsWith(q) ? 0 : 1) - (b.name.toLowerCase().startsWith(q) ? 0 : 1) ||
    (a.type === "R" ? 0 : 1) - (b.type === "R" ? 0 : 1) ||
    a.name.localeCompare(b.name));
  results = results.slice(0, 30);
  hot = -1;
  if (!results.length) { note("No stations match “" + loc.value.trim() + "”"); return; }
  drop.replaceChildren(...results.map((s, i) => {
    const o = document.createElement("div");
    o.className = "opt";
    o.innerHTML = "<b></b><span class='id'></span>";
    o.firstChild.textContent = s.name + (s.state ? ", " + s.state : "");
    o.lastChild.textContent = s.id;
    o.addEventListener("mousedown", e => { e.preventDefault(); pick(i); });
    return o;
  }));
  drop.hidden = false;
  drop.scrollTop = 0;
}

function pick(i) {
  const s = results[i];
  if (!s) return;
  st.station = Object.assign({}, s);
  loc.value = "";
  drop.hidden = true;
  saveSettings();
  updateStatus();
  loadTides();
}

let searchT = null;
loc.addEventListener("input", () => { clearTimeout(searchT); searchT = setTimeout(search, 150); });
loc.addEventListener("focus", () => { if (loc.value.trim().length >= 2) search(); });
loc.addEventListener("blur", () => setTimeout(() => { drop.hidden = true; }, 150));
loc.addEventListener("keydown", e => {
  if (drop.hidden || !results.length) { if (e.key === "Escape") { drop.hidden = true; } return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    hot = e.key === "ArrowDown" ? Math.min(hot + 1, results.length - 1) : Math.max(hot - 1, 0);
    drop.querySelectorAll(".opt").forEach((o, i) => o.classList.toggle("hot", i === hot));
    const o = drop.querySelectorAll(".opt")[hot];
    if (o) o.scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") {
    e.preventDefault(); pick(hot >= 0 ? hot : 0);
  } else if (e.key === "Escape") {
    drop.hidden = true;
  }
});

// ---- desktop window plumbing (same bridge as the Todo app) ----
window.addEventListener("pointerdown", () => {
  if (window.parent !== window) parent.postMessage({ exe: "focus" }, location.origin);
}, { capture: true, passive: true });

// no grow box on its own page, nor on a phone (?mobile=1), where the window
// fills the screen and the desktop hides its own grow boxes
const MOBILE = new URLSearchParams(location.search).has("mobile");
const grow = $("#grow");
if (window.parent === window || MOBILE) grow.style.display = "none";
if (MOBILE) $("#status").style.paddingRight = "8px";
grow.addEventListener("pointerdown", e => {
  e.preventDefault();
  grow.setPointerCapture(e.pointerId);
  const sx = e.clientX, sy = e.clientY;
  const move = ev =>
    parent.postMessage({ exe: "grow", dx: ev.clientX - sx, dy: ev.clientY - sy }, location.origin);
  const up = () => {
    grow.removeEventListener("pointermove", move);
    grow.removeEventListener("pointerup", up);
    parent.postMessage({ exe: "grow-end" }, location.origin);
  };
  grow.addEventListener("pointermove", move);
  grow.addEventListener("pointerup", up);
  parent.postMessage({ exe: "grow-start" }, location.origin);
});

// OS 9 scrollbar end-merges need the same scrolled/at-end flags as the desktop
document.addEventListener("scroll", e => {
  const el = e.target;
  if (!(el instanceof Element)) return;
  el.classList.toggle("scrolled-y", el.scrollTop >= 1);
  el.classList.toggle("at-y-end", el.scrollTop >= 1 && el.scrollTop >= el.scrollHeight - el.clientHeight - 1);
}, { capture: true, passive: true });

// The now-line and its clock move on the minute: each tick is aimed 80 ms
// past the next boundary (World Clock's schedule), so the label never lags
// the clock by most of a minute. A date rollover refetches the range, a
// half-hour-old forecast the weather. A window the desktop has closed is
// only hidden, so it sleeps until show.
let tickT = null, paused = false;
function tick() {
  const { start } = rangeSpan();
  if (fetchedKey && fetchedKey !== st.station.id + "|" + st.range + "|" + start) loadTides();
  else { draw(); updateStatus(); if (fetchedKey) loadWeather(); }
}
function schedule() {
  clearTimeout(tickT);
  tickT = setTimeout(() => { if (!paused) tick(); schedule(); }, 60000 - (Date.now() % 60000) + 80);
}
schedule();

// hide/show from the desktop pause and resume the minute tick (show ticks
// at once, so a reopened window is current in its first frame). Node sync
// landing a peer's settings on disk (forwarded by the desktop as a
// data-changed message): adopt them — settings are last-writer-wins. Skip
// while a local save is in flight; it's about to overwrite anyway.
window.addEventListener("message", async e => {
  if (e.origin !== location.origin || !e.data || typeof e.data.exe !== "string") return;
  if (e.data.exe === "hide") {
    paused = true;
    clearTimeout(tickT);
    if (saveT || saving) saveNow(true);
  } else if (e.data.exe === "show") {
    paused = false;
    tick();
    schedule();
  } else if (e.data.exe === "data-changed") {
    if (e.data.client && e.data.client === CLIENT) return; // our own write
    if (!loaded || e.data.path !== "settings.json" || saveT || saving) return;
    try {
      const r = await api(SETTINGS_URL);
      if (r.status === 404) return;
      const data = await r.json();
      if (data && data.station && data.station.id) st.station = data.station;
      if (data && [1, 3, 7].includes(data.range)) st.range = data.range;
      syncSeg();
      updateStatus();
      loadTides();
    } catch (err) {}
  }
});

new ResizeObserver(() => draw()).observe(box);

// Load settings, retrying a transient failure with backoff. Saves stay
// blocked (loaded=false) until a GET succeeds so a failed load can't clobber
// the stored station with defaults — but a daemon restart or tunnel blip
// must not silently disable saving for the whole session, so we keep trying.
let settingsTries = 0;
async function loadSettings() {
  try {
    const r = await api(SETTINGS_URL);
    if (r.status !== 404) {
      const data = await r.json();
      if (data && data.station && data.station.id) st.station = data.station;
      if (data && [1, 3, 7].includes(data.range)) st.range = data.range;
    }
    loaded = true;
    syncSeg();
    updateStatus();
    loadTides();
  } catch (e) {
    console.error("tides settings load failed:", e);
    if (settingsTries++ < 12) setTimeout(loadSettings, 5000);
    // first attempt still paints the default station so the app is usable
    if (settingsTries === 1) { syncSeg(); updateStatus(); loadTides(); }
  }
}
loadSettings();
</script>
</body>
</html>
